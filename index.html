<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manipulação RPG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="toolbar.css">
<link rel="stylesheet" href="animations.css">

</head>

<body>

<div id="loading">

<div class="loader"></div>

<h2>Manipulação RPG</h2>

<p>Carregando recursos...</p>

</div>

<div id="app">

<!-- ====================================== -->
<!-- SIDEBAR -->
<!-- ====================================== -->

<aside id="sidebar">

<header>

<h1>🎲 Manipulação</h1>

<span>Mesa Virtual</span>

</header>

<section class="library">

<div class="library-header">

<h2>Biblioteca</h2>

<button id="resetLibrary">

Restaurar

</button>

</div>

<div id="libraryList">

</div>

</section>

<section class="create-token">

<h3>Novo Token</h3>

<input
type="text"
id="tokenName"
placeholder="Nome">

<input
type="color"
id="tokenColor"
value="#6366f1">

<button id="createToken">

Adicionar

</button>

</section>

<section class="quickTools">

<h3>Ferramentas</h3>

<button id="toggleGrid">

Grid

</button>

<button id="toggleFog">

Fog

</button>

<button id="toggleMeasure">

Régua

</button>

<button id="initiative">

Iniciativa

</button>

</section>

</aside>

<!-- ====================================== -->
<!-- MAIN -->
<!-- ====================================== -->

<main id="main">

<header id="toolbar">

<div class="left">

<button id="uploadMap">

🖼️ Mapa

</button>

<button id="defaultMap">

🌎 Padrão

</button>

<button id="clearMap">

🗑 Limpar

</button>

</div>

<div class="center">

<button id="undo">

↶

</button>

<button id="redo">

↷

</button>

<button id="copy">

📄

</button>

<button id="paste">

📋

</button>

<button id="duplicate">

➕

</button>

</div>

<div class="right">

<button id="zoomOut">

➖

</button>

<span id="zoomValue">

100%

</span>

<button id="zoomIn">

➕

</button>

<button id="save">

💾 Salvar

</button>

<button id="load">

📂 Carregar

</button>

</div>

</header>

<section id="workspace">

<div id="mapWrapper">

<div id="map">

<!-- Tokens serão adicionados via JavaScript -->

</div>

</div>

</section>

<footer>

<div>

Espaço = mover mapa

</div>

<div>

Scroll = Zoom

</div>

<div>

Delete = remover

</div>

<div>

CTRL + C / CTRL + V

</div>

</footer>

</main>

<!-- ====================================== -->
<!-- MENUS -->
<!-- ====================================== -->

<div id="contextMenu">

<button id="renameToken">

Renomear

</button>

<button id="changeColor">

Cor

</button>

<button id="changeImage">

Imagem

</button>

<button id="rotateToken">

Rotacionar

</button>

<button id="deleteToken">

Excluir

</button>

</div>

<div id="initiativePanel">

<h2>Ordem de Iniciativa</h2>

<div id="initiativeList">

</div>

</div>

<input
type="file"
id="imageLoader"
accept="image/*"
hidden>

<input
type="file"
id="mapLoader"
accept="image/*"
hidden>

<script src="js/main.js"></script>
<script src="js/library.js"></script>
<script src="js/drag.js"></script>
<script src="js/zoom.js"></script>
<script src="js/storage.js"></script>
<script src="js/grid.js"></script>
<script src="js/contextMenu.js"></script>
<script src="js/ui.js"></script>
<script src="js/tokens.js"></script>

</body>

</html>
